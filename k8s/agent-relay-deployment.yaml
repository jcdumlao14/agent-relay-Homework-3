apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      containers:
        - name: agent-relay
          image: agent-relay:q4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
